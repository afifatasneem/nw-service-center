<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  
  <!-- Outer Tech Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="84" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="16 8" />
  
  <!-- Welding Shield Outline -->
  <path d="M 256 70 C 370 70 410 130 410 230 C 410 350 256 430 256 430 C 256 430 102 350 102 230 C 102 130 142 70 256 70 Z" fill="#131c31" stroke="url(#goldGrad)" stroke-width="8" />

  <!-- Shield Inner Screen / Visor -->
  <rect x="176" y="160" width="160" height="90" rx="16" fill="#080e1a" stroke="url(#cyanGrad)" stroke-width="4" />
  <rect x="190" y="175" width="132" height="60" rx="8" fill="#0e7490" opacity="0.3" />

  <!-- Welding Arc / Flash Spark -->
  <circle cx="256" cy="205" r="14" fill="#ffffff" filter="url(#glow)" />
  <path d="M 256 165 L 260 195 L 290 205 L 260 215 L 256 245 L 252 215 L 222 205 L 252 195 Z" fill="#67e8f9" opacity="0.8" />
  <circle cx="256" cy="205" r="4" fill="#ffffff" />

  <!-- NW Monogram -->
  <text x="256" y="325" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    NW
  </text>

  <!-- Subtitle -->
  <text x="256" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#f59e0b" text-anchor="middle" letter-spacing="3">
    SERVICE CENTER
  </text>
  <text x="256" y="385" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="2">
    SOLAPUR
  </text>
</svg>
